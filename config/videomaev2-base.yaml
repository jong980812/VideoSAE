# VideoMAE V2 ViT-B: the official ViT-B distilled from a giant fine-tuned on
# Kinetics-710 (head stripped) -- see models/videomaev2.py.
model_id: videomaev2-base
name: "VideoMAE V2 ViT-B (distilled from the giant fine-tuned on Kinetics-710, head stripped)"

backbone:
  wrapper: videomaev2:VideoMAEv2              # models/videomaev2.py, class VideoMAEv2
  checkpoint: OpenGVLab/VideoMAEv2-Base
  revision: 78c337a418cc4adaf7f1ff6c7ba343418393966b

# What the loaded checkpoint must look like; get_model() refuses a mismatch.
expect:
  blocks: 12
  width: 768
  frames: 16                                  # at 224 x 224
  token_grid: [8, 14, 14]
  cls_token: false

# The SAE for block N (evaluate.py --layer N, load_sae): a folder holding ae.pt +
# config.json, with {layer} filled in. Relative paths are relative to this repo.
# Point it elsewhere to use other weights (e.g. train_sae.py --out_dir my_weights
# writes my_weights/<model_id>/l<N>/).
sae:
  dir: weights/sae/videomaev2-base/l{layer}

# One classifier per label space; a dataset config (config/datasets/) names the
# label space it is scored in (HAT is scored in kinetics400's).
head:
  kinetics400:
    type: probe                               # linear map on fc_norm(mean over tokens), fitted
                                              # by train_probe.py, same protocol as the
                                              # VideoPrism / V-JEPA 2 probes: 73.2%
    path: weights/heads/kinetics400/videomaev2-base.pt
    sha256: 174c07adac7322bb3ea645785df990e9626290183cb89f7edb6e323e3d8802fe
  nturgbd:
    type: probe
    path: weights/heads/nturgbd/videomaev2-base.pt    # not fitted yet
    sha256: null
  ssv2:
    type: probe
    path: weights/heads/ssv2/videomaev2-base.pt       # not fitted yet
    sha256: null

extract:                                      # extract_activations.py defaults
  layers: 0-11
  batch_size: 8
  rows_per_shard: 200000

probe:                                        # train_probe.py defaults
  batch_size: 8

eval:                                         # evaluate.py defaults
  batch_size: 8
